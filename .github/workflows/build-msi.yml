name: Build Windows MSI Installer

on:
    workflow_dispatch:
        inputs:
            create_release:
                description: "Create GitHub Release"
                required: false
                default: false
                type: boolean
            version:
                description: "Version number (e.g., 1.0.0) - defaults to package.json version; required if creating release"
                required: false
                default: ""
                type: string

env:
    # Windows Service Wrapper: runs the pkg console exe as a real Windows service
    WINSW_URL: https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe

jobs:
    build-msi:
        runs-on: windows-latest
        name: Build Windows MSI Installer

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm

            - name: Setup WiX Toolset
              run: choco install wixtoolset -y --no-progress
              shell: pwsh

            - name: Resolve version
              id: ver
              shell: pwsh
              run: |
                  $v = "${{ inputs.version }}"
                  if (-not $v) { $v = (Get-Content package.json | ConvertFrom-Json).version }
                  $v = $v.TrimStart('v')
                  "version=$v" >> $env:GITHUB_OUTPUT

            - name: Build executable
              shell: cmd
              run: |
                  call npm ci || call npm install
                  call npx --yes @yao-pkg/pkg . --targets node20-win-x64 --output dist\direct-print-win.exe
                  if not exist dist\direct-print-win.exe exit /b 1

            - name: Prepare installer files
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force installer\bin, installer\resources | Out-Null
                  Copy-Item dist\direct-print-win.exe installer\bin\DirectPrintServer.exe
                  Copy-Item public\logo.ico installer\resources\app.ico
                  Copy-Item public\banner.bmp installer\resources\banner.bmp
                  Copy-Item -Recurse scripts\windows installer\scripts

                  Invoke-WebRequest $env:WINSW_URL -OutFile installer\bin\DirectPrintService.exe
                  Write-Host "WinSW SHA256: $((Get-FileHash installer\bin\DirectPrintService.exe).Hash)"
                  Copy-Item scripts\windows\service\DirectPrintService.xml installer\bin\DirectPrintService.xml

                  '{\rtf1\ansi\deff0 {\fonttbl {\f0 Times New Roman;}} \f0\fs24 Direct Print Server License Agreement\par\par This software is provided as-is for printer management.\par }' | Out-File -Encoding ascii license.rtf

            - name: Create WiX configuration
              shell: pwsh
              run: |
                  @'
                  <?xml version="1.0" encoding="UTF-8"?>
                  <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
                    <Product Id="*" Name="Direct Print Server" Language="1033" Version="$(var.ProductVersion)"
                             Manufacturer="Direct Print Solutions" UpgradeCode="12345678-1234-5678-9012-123456789012">

                      <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" InstallPrivileges="elevated"
                               Description="Direct Print Server" />
                      <MajorUpgrade DowngradeErrorMessage="A newer version is already installed." AllowSameVersionUpgrades="yes" />
                      <MediaTemplate EmbedCab="yes" />

                      <Icon Id="AppIcon" SourceFile="installer\resources\app.ico" />
                      <Property Id="ARPPRODUCTICON" Value="AppIcon" />

                      <Feature Id="ProductFeature" Title="Direct Print Server" Level="1">
                        <ComponentGroupRef Id="ProductComponents" />
                        <ComponentGroupRef Id="StartMenuComponents" />
                        <ComponentRef Id="RegistryEntries" />
                      </Feature>

                      <Directory Id="TARGETDIR" Name="SourceDir">
                        <Directory Id="ProgramFiles64Folder">
                          <Directory Id="INSTALLFOLDER" Name="DirectPrintServer" />
                        </Directory>
                        <Directory Id="ProgramMenuFolder">
                          <Directory Id="ApplicationProgramsFolder" Name="Direct Print Server" />
                        </Directory>
                      </Directory>

                      <ComponentGroup Id="ProductComponents" Directory="INSTALLFOLDER">
                        <Component Id="MainExecutable" Guid="11111111-1111-1111-1111-111111111111" Win64="yes">
                          <File Id="DirectPrintServerEXE" Source="installer\bin\DirectPrintServer.exe" KeyPath="yes" />
                        </Component>

                        <!-- Windows service (WinSW wrapper -> DirectPrintServer.exe), auto-start, restart on crash -->
                        <Component Id="ServiceWrapper" Guid="77777777-7777-7777-7777-777777777777" Win64="yes">
                          <File Id="ServiceWrapperEXE" Source="installer\bin\DirectPrintService.exe" KeyPath="yes" />
                          <File Id="ServiceWrapperXML" Source="installer\bin\DirectPrintService.xml" />
                          <ServiceInstall Id="DPSServiceInstall" Name="DirectPrintServer" DisplayName="Direct Print Server"
                                          Description="Thermal printer service for POS (http://localhost:4000)"
                                          Type="ownProcess" Start="auto" ErrorControl="normal" Account="LocalSystem" Vital="yes" />
                          <ServiceControl Id="DPSServiceControl" Name="DirectPrintServer" Start="install" Stop="both" Remove="uninstall" Wait="yes" />
                        </Component>

                        <Component Id="WixScripts" Guid="44444444-4444-4444-4444-444444444444" Win64="yes">
                          <File Id="PreUninstallBat" Source="installer\scripts\wix\pre-uninstall.bat" KeyPath="yes" />
                          <RemoveFolder Id="INSTALLFOLDER" Directory="INSTALLFOLDER" On="uninstall" />
                        </Component>
                      </ComponentGroup>

                      <ComponentGroup Id="StartMenuComponents" Directory="ApplicationProgramsFolder">
                        <Component Id="StartMenuShortcut" Guid="66666666-6666-6666-6666-666666666666">
                          <!-- Opens the status page; the server itself runs as a service -->
                          <Shortcut Id="StatusPageShortcut" Name="Direct Print Server"
                                    Description="Status Direct Print Server (http://localhost:4000)"
                                    Target="[WindowsFolder]explorer.exe" Arguments="http://localhost:4000/html/index.html"
                                    Icon="AppIcon" />
                          <RemoveFolder Id="CleanUpShortcut" Directory="ApplicationProgramsFolder" On="uninstall" />
                          <RegistryValue Root="HKCU" Key="SOFTWARE\DirectPrintServer" Name="startmenu" Type="integer" Value="1" KeyPath="yes" />
                        </Component>
                      </ComponentGroup>

                      <DirectoryRef Id="TARGETDIR">
                        <Component Id="RegistryEntries" Guid="55555555-5555-5555-5555-555555555555">
                          <RegistryKey Root="HKLM" Key="SOFTWARE\DirectPrintServer">
                            <RegistryValue Type="string" Name="InstallPath" Value="[INSTALLFOLDER]" KeyPath="yes" />
                            <RegistryValue Type="string" Name="Version" Value="$(var.ProductVersion)" />
                          </RegistryKey>
                        </Component>
                      </DirectoryRef>

                      <Property Id="WIXUI_INSTALLDIR" Value="INSTALLFOLDER" />
                      <UIRef Id="WixUI_InstallDir" />
                      <WixVariable Id="WixUILicenseRtf" Value="license.rtf" />
                      <WixVariable Id="WixUIBannerBmp" Value="installer\resources\banner.bmp" />

                      <!-- Before installing: stop a manually started DirectPrintServer.exe (older versions) so port 4000 is free -->
                      <CustomAction Id="KillManualExe" Directory="TARGETDIR" Execute="deferred" Impersonate="no" Return="ignore"
                                    ExeCommand="[SystemFolder]taskkill.exe /F /IM DirectPrintServer.exe /IM direct-print-win.exe" />

                      <!-- On uninstall: remove legacy services / startup entries from older versions -->
                      <CustomAction Id="SetPreUninstallData" Property="RunPreUninstall" Value="INSTALLFOLDER=[INSTALLFOLDER]" Execute="immediate" />
                      <CustomAction Id="RunPreUninstall" FileKey="PreUninstallBat" ExeCommand="" Execute="deferred" Impersonate="no" Return="ignore" />

                      <InstallExecuteSequence>
                        <Custom Action="KillManualExe" Before="InstallServices">NOT REMOVE~="ALL"</Custom>
                        <Custom Action="SetPreUninstallData" Before="RunPreUninstall">REMOVE~="ALL"</Custom>
                        <Custom Action="RunPreUninstall" After="StopServices">REMOVE~="ALL"</Custom>
                      </InstallExecuteSequence>

                      <Condition Message="ADMINISTRATOR PRIVILEGES REQUIRED - Please right-click the MSI file and select 'Run as administrator'.">
                        Privileged
                      </Condition>
                    </Product>
                  </Wix>
                  '@ | Out-File -FilePath DirectPrintServer.wxs -Encoding utf8

            - name: Build MSI with WiX
              shell: cmd
              run: |
                  candle -arch x64 -dProductVersion=${{ steps.ver.outputs.version }} DirectPrintServer.wxs -out DirectPrintServer.wixobj || exit /b 1
                  light DirectPrintServer.wixobj -out DirectPrintServer.msi -ext WixUIExtension || exit /b 1

            - name: Smoke test (install, service running, HTTP, uninstall)
              shell: pwsh
              run: |
                  $p = Start-Process msiexec -ArgumentList '/i', 'DirectPrintServer.msi', '/qn', '/l*v', 'install.log' -Wait -PassThru
                  if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 80; throw "install failed: $($p.ExitCode)" }

                  $svc = Get-Service DirectPrintServer
                  Write-Host "Service: $($svc.Status) / $($svc.StartType)"
                  if ($svc.Status -ne 'Running' -or $svc.StartType -ne 'Automatic') { throw "service not running/automatic" }

                  $ok = $false
                  foreach ($i in 1..30) {
                    try { $r = Invoke-RestMethod http://localhost:4000/printers; $ok = $true; break } catch { Start-Sleep 1 }
                  }
                  if (-not $ok) { Get-Content "C:\Program Files\DirectPrintServer\logs\*" -ErrorAction SilentlyContinue; throw "HTTP not reachable" }
                  Write-Host "Printers: $($r.printers -join ', ') | default: $($r.defaultPrinter)"
                  Get-ChildItem "C:\Program Files\DirectPrintServer\logs"

                  $p = Start-Process msiexec -ArgumentList '/x', 'DirectPrintServer.msi', '/qn' -Wait -PassThru
                  if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
                  if (Get-Service DirectPrintServer -ErrorAction SilentlyContinue) { throw "service still present after uninstall" }
                  Write-Host "Uninstall OK"

            - name: Rename for release
              shell: cmd
              run: |
                  mkdir release
                  copy DirectPrintServer.msi "release\Direct-Print-Server-v${{ steps.ver.outputs.version }}-windows.msi"

            - uses: actions/upload-artifact@v4
              with:
                  name: direct-print-msi
                  path: release/
                  retention-days: 90

    release:
        needs: build-msi
        if: ${{ inputs.create_release == true && inputs.version != '' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: direct-print-msi
                  path: release

            - name: Create or update release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ inputs.version }}
                  name: Direct Print Server v${{ inputs.version }}
                  target_commitish: ${{ github.sha }}
                  files: release/*.msi
                  append_body: true
                  body: |
                      ## 🪟 Windows

                      1. Download `Direct-Print-Server-v${{ inputs.version }}-windows.msi`
                      2. Klik kanan → **Run as administrator** → ikuti wizard
                      3. Selesai. Server jalan sebagai **Windows Service** `DirectPrintServer` (otomatis saat boot, restart sendiri kalau crash) → http://localhost:4000

                      Tidak perlu membuka aplikasi apa pun. Versi lama ter-upgrade otomatis.

                      | | |
                      |---|---|
                      | Status | `sc query DirectPrintServer` atau `services.msc` |
                      | Restart | `sc stop DirectPrintServer` lalu `sc start DirectPrintServer` |
                      | Log | `C:\Program Files\DirectPrintServer\logs\` |
                      | Uninstall | Settings → Apps → Direct Print Server |
