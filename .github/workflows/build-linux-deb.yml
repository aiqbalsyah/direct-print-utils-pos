name: Build Linux DEB Package

on:
    workflow_dispatch:
        inputs:
            create_release:
                description: "Create GitHub Release"
                required: false
                default: false
                type: boolean
            version:
                description: "Version number (e.g., 1.0.0) - defaults to package.json version; required if creating release"
                required: false
                default: ""
                type: string

jobs:
    build-deb:
        name: Build DEB (${{ matrix.arch }})
        runs-on: ${{ matrix.runner }}
        strategy:
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-24.04
                    - arch: arm64
                      runner: ubuntu-24.04-arm

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm

            - name: Install dependencies
              run: npm ci || npm install

            - name: Resolve version
              id: ver
              run: |
                  VERSION="${{ inputs.version }}"
                  [ -z "$VERSION" ] && VERSION="$(node -p "require('./package.json').version")"
                  echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

            - name: Build DEB
              run: scripts/linux/build-deb.sh "${{ steps.ver.outputs.version }}" "${{ matrix.arch }}"

            - name: Lint package
              run: |
                  sudo apt-get update -qq && sudo apt-get install -y -qq lintian
                  lintian --no-tag-display-limit dist/*.deb || true

            - name: Smoke test (install, run, remove)
              run: |
                  DEB="$(ls dist/direct-print-server_*_${{ matrix.arch }}.deb)"
                  sudo apt-get install -y "./$DEB"
                  systemctl is-active direct-print-server
                  for i in $(seq 1 20); do curl -fsS http://localhost:4000/printers && break; sleep 1; done
                  curl -fsS http://localhost:4000/html/index.html >/dev/null
                  sudo apt-get remove -y direct-print-server
                  ! systemctl is-active direct-print-server

            - name: Rename for release
              run: |
                  mkdir -p release
                  cp dist/direct-print-server_*_${{ matrix.arch }}.deb \
                     "release/Direct-Print-Server-v${{ steps.ver.outputs.version }}-linux-${{ matrix.arch }}.deb"

            - uses: actions/upload-artifact@v4
              with:
                  name: direct-print-linux-deb-${{ matrix.arch }}
                  path: release/
                  retention-days: 90

    release:
        needs: build-deb
        if: ${{ inputs.create_release == true && inputs.version != '' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: direct-print-linux-deb-*
                  path: release
                  merge-multiple: true

            - name: Create or update release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ inputs.version }}
                  name: Direct Print Server v${{ inputs.version }}
                  target_commitish: ${{ github.sha }}
                  files: release/*.deb
                  append_body: true
                  body: |
                      ## 🐧 Ubuntu / Debian

                      **Install (one line, auto-detects amd64/arm64):**
                      ```bash
                      curl -fsSL https://raw.githubusercontent.com/aiqbalsyah/direct-print-utils-pos/main/scripts/linux/install.sh | sudo VERSION=${{ inputs.version }} bash
                      ```

                      **Or manually:**
                      ```bash
                      sudo apt install ./Direct-Print-Server-v${{ inputs.version }}-linux-amd64.deb
                      ```

                      Service starts automatically → http://localhost:4000

                      | | |
                      |---|---|
                      | Status | `systemctl status direct-print-server` |
                      | Logs | `journalctl -u direct-print-server -f` |
                      | Uninstall | `sudo apt remove direct-print-server` |

                      Supported: Ubuntu 20.04+, Debian 11+, Linux Mint 20+ (amd64, arm64). Printer must be set up in CUPS.
